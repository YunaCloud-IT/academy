name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'Examples/E_Commerce_Shop/shopworld/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Examples/E_Commerce_Shop/shopworld/**'

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # This ensures every 'run' command starts inside your NestJS app folder
    defaults:
      run:
        working-directory: Examples/E_Commerce_Shop/shopworld

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # We must tell the cache where the lockfile is since it's not in root
          cache-dependency-path: Examples/E_Commerce_Shop/shopworld/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Lint and Build
        run: npx nx run-many -t lint build -p backend

      - name: Test with Coverage
        run: npx nx run-many -t test -p backend --codeCoverage

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push to Docker Hub
        id: docker_build
        run: |
          # Create a unique tag
          VERSION="v${{ github.run_number }}-$(git rev-parse --short HEAD)"
          IMAGE_NAME="itchimonji/shopworld-backend"
          
          # Build and Push
          docker build -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest
          
          # Save the version for the next step
          echo "tag=$VERSION" >> $GITHUB_OUTPUT


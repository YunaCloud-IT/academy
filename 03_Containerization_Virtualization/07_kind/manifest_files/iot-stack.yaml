---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/

    # Log to both file and stdout
    log_dest file /mosquitto/log/mosquitto.log
    log_dest stdout

    # MQTT Default listener
    listener 1883 0.0.0.0
    allow_anonymous true

    # WebSockets listener
    listener 9001 0.0.0.0
    protocol websockets
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-config
data:
  telegraf.conf: |
    [agent]
        interval = "10s"
        round_interval = true
        metric_batch_size = 1000
        metric_buffer_limit = 10000
        collection_jitter = "0s"
        flush_interval = "10s"
        flush_jitter = "0s"
        precision = ""
        hostname = ""
        omit_hostname = false

    [[outputs.influxdb_v2]]
        urls = ["http://influxdb:8086"]
        token = "my-super-secret-auth-token"
        organization = "academy"
        bucket = "iot_data"

    [[inputs.mqtt_consumer]]
        servers = ["tcp://mosquitto:1883"]
        topics = [
          "academy/#",
        ]
        data_format = "json_v2"
        [inputs.mqtt_consumer.tags]
        env = "iot"

        [[inputs.mqtt_consumer.json_v2]]

          # --- 1. NESTJS PAYLOAD HANDLING ---
          # Dive into the "data" wrapper if it exists. (optional = true prevents crashes if it doesn't)
          [[inputs.mqtt_consumer.json_v2.object]]
            path = "data"
            optional = true
            disable_prepend_keys = true
            tags = [
              "deviceId", "machineId", "patientId", "truckId", "shipmentId",
              "cowId", "nodeId", "binId", "intersectionId", "substationId",
              "assetId", "epc", "sku", "profile", "cargoProfile", "assetType",
              "crop", "driverName"
            ]

          # --- 2. FLAT JSON PAYLOAD HANDLING ---
          # If the payload is flat (no "data" wrapper), these rules map the IDs to tags.
          # (optional = true prevents crashes if the payload doesn't contain the specific ID).
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "deviceId"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "machineId"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "patientId"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "truckId"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "shipmentId"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "cowId"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "nodeId"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "binId"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "intersectionId"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "substationId"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "assetId"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "epc"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "sku"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "profile"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "cargoProfile"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "assetType"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "crop"
            optional = true
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "driverName"
            optional = true

          # Optional: Rename nested tags if they exist
          [[inputs.mqtt_consumer.json_v2.tag]]
            path = "tags.topic"
            rename = "topic"
            optional = true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-datasources
data:
  influxdb.yml: |
    apiVersion: 1

    datasources:
      - name: InfluxDB_v2
        type: influxdb
        access: proxy
        url: http://influxdb:8086
        jsonData:
          version: Flux
          organization: academy
          defaultBucket: iot_data
          tlsSkipVerify: true
        secureJsonData:
          token: my-super-secret-auth-token
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-dashboards
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: 'Academy Dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/json
---

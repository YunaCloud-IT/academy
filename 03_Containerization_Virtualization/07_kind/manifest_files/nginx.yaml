---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-index-html-configmap
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Hello Kind!</title>
        <style>
            body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f0f8ff; }
            h1 { color: #2c3e50; }
        </style>
    </head>
    <body>
    <h1>Rocket Since - Hello from your Local Kind Cluster!</h1>
    <p>This page is served from a ConfigMap - V2.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine3.23
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"   # Guaranteed memory
              cpu: "100m"      # Guaranteed 10% of a CPU core
            limits:
              memory: "128Mi"  # Hard ceiling for memory
              cpu: "200m"      # Hard ceiling for CPU (20%)
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5   # Wait 5s after start before checking
            periodSeconds: 10
          volumeMounts:
            # Mount the volume to the Nginx html directory
            - name: html-volume
              mountPath: /usr/share/nginx/html
      volumes:
        # Define the volume based on the ConfigMap
        - name: html-volume
          configMap:
            name: nginx-index-html-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type:  NodePort
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80        # The port the Service exposes within the cluster
      targetPort: 80  # The port the Nginx container listens on
      nodePort: 30080 # CRITICAL: This must match the containerPort in kind-config.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopworld-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopworld-backend
  template:
    metadata:
      labels:
        app: shopworld-backend
    spec:
      containers:
        - name: backend
          # UPDATED: Pointing to your repository image
          image: itchimonji/shopworld-backend:v3

          # UPDATED: Removed "Never" so it can pull from the registry.
          # "IfNotPresent" is the default for versioned tags, which is perfect here.
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: shopworld-backend-service
spec:
  type: NodePort
  selector:
    app: shopworld-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30081

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  # 1 Control Plane Node with enhancements
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
      - containerPort: 30081
        hostPort: 8081
    extraMounts:
      - hostPath: ./cluster-data
        containerPath: /var/local-path-provisioner
  # 2 Worker Nodes
  - role: worker
  - role: worker
